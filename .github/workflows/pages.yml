name: Demo en GitHub Pages

# Publica examples/demo como demo en vivo en https://ocardona0712.github.io/ojs/
# Activar en Settings → Pages → Source: GitHub Actions
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w examples/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
